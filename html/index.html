<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samy Waypoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:ital,wght@1,700;1,800&family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="waypoint-container" class="hidden">
        <div class="distance-row">
            <span id="distance-val">0</span><span id="distance-unit">M</span>
        </div>
        <div class="divider-line"></div>
        <div id="destination-label" class="destination-text">DESTINO</div>
        <div class="arrow-container">
            <svg class="down-arrow" viewBox="0 0 24 16" width="18" height="12">
                <polygon points="0,0 24,0 12,16" />
            </svg>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
